<!doctype html>
<html lang="en" data-section="thoughts" data-skin="yarn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tier list · Thoughts · blaqat.net</title>
<script>
  // pick the skin before first paint (same markup, different CSS)
  (function () {
    var p = new URLSearchParams(location.search);
    var skin = p.get("skin") === "ethereal" ? "ethereal" : "yarn";
    var root = document.documentElement;
    root.dataset.skin = skin;
    if (p.has("reduced") || matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("tl-reduced");
    if (skin === "ethereal") {
      var m = document.createElement("meta"); m.name = "color-scheme"; m.content = "dark"; document.head.appendChild(m);
      var f = document.createElement("link"); f.rel = "stylesheet";
      f.href = "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&display=swap";
      document.head.appendChild(f);
    }
  })();
</script>
<link rel="stylesheet" href="../kit/yarn.css">
<link rel="stylesheet" href="tierlist.css">
<link rel="stylesheet" href="tierlist-ethereal.css">
<script src="../kit/data.js"></script>
<script src="../kit/thoughts-data.js"></script>
<script src="../kit/yarn.js" defer></script>
<script src="tierlist-images.js" defer></script>
<script src="tierlist-drag.js" defer></script>
<script src="tierlist.js" defer></script>
</head>
<body class="frame">
<main class="sheet">
  <yarn-nav active="thoughts" base="../"></yarn-nav>
  <script>
    if (document.documentElement.dataset.skin === "ethereal") document.currentScript.previousElementSibling.setAttribute("material", "velvet");
  </script>
  <div class="tl" id="tl">
    <noscript><p style="padding:24px">The tier list maker needs JavaScript in this mock.</p></noscript>
  </div>
</main>
<!-- floating clone layer for drags (outside every transformed / filtered ancestor) -->
<div id="tl-layer" aria-hidden="true"></div>
<!-- screen reader announcements for picks, moves and drops -->
<div id="tl-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
<!-- global player: music keeps playing while ranking -->
<yarn-player></yarn-player>
<script>
  if (document.documentElement.dataset.skin === "ethereal") document.querySelector("yarn-player").setAttribute("theme", "night");
</script>
<script src="../kit/player.js" defer></script>
</body>
</html>
