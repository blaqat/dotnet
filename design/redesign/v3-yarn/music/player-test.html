<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yarn-player · standalone test</title>
<!-- Deliberately blank: no yarn.css, no yarn.js, no nav. Only the data + the player. -->
<script src="../kit/data.js"></script>
<script src="../kit/player.js" defer></script>
<style>
  body { margin: 0; padding: 32px 20px calc(var(--bottom-ui, 0px) + 24px); font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: #555; max-width: 60ch; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  button { font: inherit; padding: 8px 12px; border: 1px solid #bbb; border-radius: 8px; background: #f6f6f6; cursor: pointer; }
  pre { background: #f6f6f6; padding: 12px; border-radius: 8px; font-size: 12px; max-width: 70ch; overflow: auto; }
</style>
</head>
<body>
  <h1>&lt;yarn-player&gt; on a blank page</h1>
  <p>No kit CSS or nav here. The player injects its own styles, reads <code>window.BLAQAT</code> when present, and exposes <code>window.YarnPlayer</code>. Try <code>?demo</code>, <code>?demo&amp;player=expanded</code>, <code>?pmode=dock</code>, <code>?ios=1</code>.</p>
  <div class="row">
    <button type="button" data-id="vgm-class_combat">play("vgm-class_combat")</button>
    <button type="button" data-id="cast adrift">play("cast adrift")</button>
    <button type="button" data-obj>play({ name, url }) not in the library</button>
    <button type="button" onclick="YarnPlayer.toggle()">toggle()</button>
    <button type="button" onclick="YarnPlayer.prev()">prev()</button>
    <button type="button" onclick="YarnPlayer.next()">next()</button>
    <button type="button" onclick="YarnPlayer.expand()">expand()</button>
  </div>
  <pre id="out">state will appear here</pre>
  <yarn-player></yarn-player>
  <script>
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.id) YarnPlayer.play(b.dataset.id);
      if (b.hasAttribute("data-obj")) YarnPlayer.play({ name: "a thoughts playlist pick", url: "https://music.blaqat.net/daw/midnight-wish.mp3", instrument: "daw" });
    });
    addEventListener("DOMContentLoaded", () => {
      const out = document.getElementById("out");
      const show = (s, kind) => { if (kind === "time") return; out.textContent = JSON.stringify({ kind, track: s.track?.name, id: s.track?.id, index: s.index, queue: s.queue.map((t) => t.name), playing: s.playing, time: Math.round(s.time), duration: Math.round(s.duration), volume: s.volume, muted: s.muted, shuffle: s.shuffle, repeat: s.repeat, expanded: s.expanded, demo: s.demo }, null, 2); };
      YarnPlayer.on(show);
      show(YarnPlayer.state, "init");
    });
  </script>
</body>
</html>
