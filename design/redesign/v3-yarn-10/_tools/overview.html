<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Round 3 overview</title>
<style>
  .ov { display: grid; gap: 14px; font-family: var(--font-sans); color: var(--foreground); }
  .ov-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ov-phones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 2fr; gap: 12px; align-items: start; }
  figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
  figure img { width: 100%; height: auto; border-radius: calc(var(--radius) * .75); border: 1px solid var(--border); display: block; }
  figcaption { font-size: 12px; line-height: 1.35; color: var(--muted-foreground); }
  figcaption b { color: var(--foreground); font-weight: 600; }
  .ov-note { font-size: 12.5px; line-height: 1.45; color: var(--muted-foreground); padding: 12px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); }
  .ov-note b { color: var(--foreground); }
  @media (max-width: 520px) { .ov-grid, .ov-phones { grid-template-columns: 1fr 1fr; } .ov-phones .ov-note { grid-column: 1 / -1; } }
</style></head>
